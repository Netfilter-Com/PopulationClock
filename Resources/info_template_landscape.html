<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
* {
    margin: 0;
    padding: 0;
    -webkit-user-select: none;
}
body {
    /* Follow Dynamic Type, but not past the point where the panel is unusable */
    font-size: min(1em, 30px);
    background-color: transparent;
    margin: 12px 20px;
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
}
html {
    font: -apple-system-body;
    -webkit-text-size-adjust: 100%;
}
p {
    font-family: "HelveticaNeue-Light";
    font-size: 0.824em; /* 14px at the default size */
    /* This panel sits on the dark artwork (the portrait one is a light box) */
    color: #e6e6e6;
}
</style>
</head>
<body>
    <p>%%DESCRIPTION%%</p>
</body>
</html>
